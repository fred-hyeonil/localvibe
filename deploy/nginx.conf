# /etc/nginx/sites-available/localvibe 에 이 내용을 복사해서 사용하세요.
# 사용법(서버에서):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/localvibe
#   sudo ln -s /etc/nginx/sites-available/localvibe /etc/nginx/sites-enabled/localvibe
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# server_name은 도메인이 생기면 그 도메인으로, 아직 없으면 EC2 퍼블릭 IP로 바꿔주세요.

server {
    listen 80;
    server_name _;  # 도메인 있으면 예: example.com www.example.com

    # 프론트엔드: React(Vite) 빌드 결과물
    root /var/www/localvibe/front/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 백엔드 API: FastAPI(uvicorn)로 프록시
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 업로드 이미지 등 정적 파일을 back/static에서 서빙하는 경우
    location /static/ {
        proxy_pass http://127.0.0.1:8000/static/;
        proxy_set_header Host $host;
    }

    client_max_body_size 20M;
}
